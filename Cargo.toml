[package]
name = "ndm-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "A Rust download manager for Windows, compatible with the official NeatDownloadManager browser extension"
license = "MIT"

[lib]
name = "ndm_rs"
path = "src/lib.rs"

[[bin]]
name = "ndm-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha1 = "0.10"
url = "2"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"
eframe = "0.31.1"
egui = "0.31.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
open = "5"
aes = "0.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
tray-icon = "0.26"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
strip = "symbols"